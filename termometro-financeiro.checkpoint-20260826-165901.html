<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Termômetro Financeiro</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>%F0%9F%8C%A1</text></svg>">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.112.3/dist/umd/supabase.js" integrity="sha384-qafw21c/iciq0VXsi9FzkfoQv5I/V0iqE4lSNcKXPnW9/UTJLnv5CcN4FHxVLnKg" crossorigin="anonymous"></script>
<style>
  :root{
    --bg:#161826;
    --surface:#232532;
    --surface-2:#161826;
    --line:rgba(233,233,237,0.16);
    --text:#e9e9ed;
    --muted:#75798c;
    --cold:#9184d9;
    --warm:#F97316;
    --hot:#EF4444;
    --mid:#F59E0B;
    --good:#34D399;
    --saldo-deep-neg:#DC2626;
    --saldo-neg:#EF4444;
    --saldo-neutral:#F59E0B;
    --saldo-pos:#6EE7B7;
    --saldo-deep-pos:#059669;
  }
  :root[data-tf-theme="light"]{
    --bg:#F4F6FA;
    --surface:#FFFFFF;
    --surface-2:#EAEFF6;
    --line:#D8E0EA;
    --text:#1A2233;
    --muted:#6B7686;
    --cold:#5D5294;
    --warm:#EA580C;
    --hot:#DC2626;
    --mid:#D97706;
    --good:#059669;
    --saldo-deep-neg:#991B1B;
    --saldo-neg:#DC2626;
    --saldo-neutral:#D97706;
    --saldo-pos:#10B981;
    --saldo-deep-pos:#047857;
  }
  *{box-sizing:border-box;}
  html, body{
    background:var(--bg);
    margin:0;
  }
  #tf-app{
    background:var(--bg);
    color:var(--text);
    font-family:'Inter', system-ui, sans-serif;
    padding:28px clamp(16px, 4vw, 56px) 36px;
    max-width:1800px;
    width:100%;
    margin:0 auto;
  }
  @media (max-width: 640px){
    #tf-app{ padding:16px 12px 24px; }
    .tf-title{ font-size:21px; }
  }
  .tf-head{
    display:flex;
    align-items:flex-start;
    justify-content:space-between;
    margin-bottom:6px;
    flex-wrap:wrap;
    gap:8px;
  }
  .tf-theme-switch{
    display:flex;
    align-items:center;
    gap:7px;
    flex-shrink:0;
  }
  .tf-theme-switch button{
    width:42px;
    height:24px;
    border-radius:14px;
    background:var(--surface-2);
    border:1px solid var(--line);
    position:relative;
    cursor:pointer;
    padding:0;
    flex-shrink:0;
  }
  .tf-theme-switch button::after{
    content:'';
    position:absolute;
    top:2px;
    left:2px;
    width:18px;
    height:18px;
    border-radius:50%;
    background:var(--cold);
    transition:transform .2s ease;
  }
  .tf-theme-switch button.is-light::after{
    transform:translateX(18px);
    background:var(--warm);
  }
  .tf-theme-switch-icon{
    font-size:13px;
    line-height:1;
    color:var(--muted);
  }
  .tf-title{
    font-family:'Inter', system-ui, sans-serif;
    font-weight:500;
    font-size:26px;
    letter-spacing:-0.01em;
  }
  .tf-sub{
    color:var(--muted);
    font-size:12.5px;
    margin-top:2px;
  }
  .tf-nav{
    display:flex;
    align-items:center;
    gap:10px;
    margin:18px 0 20px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:8px 10px;
  }
  .tf-nav button{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    width:30px;height:30px;
    border-radius:7px;
    cursor:pointer;
    font-size:15px;
    line-height:1;
  }
  .tf-nav button:hover{ background:#26395A; }
  .tf-nav button.tf-month-label{
    flex:1;
    width:auto;
    height:auto;
    background:none;
    border:none;
    color:var(--text);
    font-family:inherit;
    padding:4px 0;
    text-align:center;
    font-weight:600;
    font-size:14.5px;
    text-transform:capitalize;
  }
  .tf-nav button.tf-month-label:hover{ background:none; color:var(--cold); }
  .tf-month-picker{
    flex:1;
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:7px;
    padding:5px 8px;
    font-family:'Inter', sans-serif;
    font-size:13px;
    text-align:center;
  }
  .tf-nav button.tf-reset{
    width:auto;
    height:auto;
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    font-size:11.5px;
    padding:5px 10px;
  }
  .tf-nav button.tf-reset:hover{ background:none; color:var(--hot); border-color:var(--hot); }
  .tf-main{
    display:flex;
    gap:18px;
    align-items:flex-start;
  }
  .tf-gauge-col{
    width:78px;
    flex-shrink:0;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:8px;
    position:sticky;
    top:0;
  }
  .tf-gauge{
    width:30px;
    height:230px;
    border-radius:16px;
    position:relative;
    overflow:hidden;
    background:linear-gradient(to top, var(--hot) 0%, var(--warm) 28%, var(--mid) 55%, var(--cold) 100%);
    border:1px solid var(--line);
  }
  .tf-gauge-mask{
    position:absolute;
    top:0; left:0; right:0;
    background:var(--surface);
    opacity:0.93;
    transition:height .4s ease;
  }
  .tf-gauge-bulb{
    width:46px;height:46px;
    border-radius:50%;
    border:1px solid var(--line);
    margin-top:-2px;
  }
  .tf-gauge-label{
    font-size:11px;
    color:var(--muted);
    text-align:center;
    line-height:1.3;
  }
  .tf-gauge-value{
    font-family:'Inter', sans-serif;
    font-size:13.5px;
    font-weight:600;
    text-align:center;
  }
  .tf-body{ flex:1; min-width:0; }
  .tf-opening{
    display:flex;
    align-items:center;
    gap:8px;
    font-size:12.5px;
    color:var(--muted);
    margin-bottom:10px;
  }
  .tf-opening input{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:4px 8px;
    width:110px;
    font-family:'Inter', sans-serif;
    font-size:12.5px;
  }
  .tf-opening{ flex-wrap:wrap; }
  .tf-opening-auto{
    font-family:'Inter', sans-serif;
    color:var(--text);
    font-weight:600;
  }
  .tf-opening-auto-note{
    font-size:10.5px;
    color:var(--muted);
    font-style:italic;
  }
  .tf-hint{
    font-size:11px;
    color:var(--muted);
    margin:-2px 0 12px;
  }
  .tf-hint strong{
    color:var(--cold);
    font-family:'Inter', sans-serif;
    font-weight:600;
  }
  .tf-tabs{
    display:flex;
    gap:6px;
    margin:14px 0 18px;
  }
  .tf-tabs button{
    background:var(--surface);
    border:1px solid var(--line);
    color:var(--muted);
    padding:7px 14px;
    border-radius:8px;
    font-size:12.5px;
    font-weight:600;
    cursor:pointer;
  }
  .tf-tabs button.active{
    background:var(--surface-2);
    color:var(--text);
    border-color:var(--cold);
  }
  .tf-inv-summary{
    display:flex;
    gap:10px;
    margin-bottom:18px;
    flex-wrap:wrap;
  }
  .tf-cards{
    display:flex;
    flex-direction:column;
    gap:12px;
  }
  .tf-card{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:11px;
    padding:14px 16px;
  }
  .tf-card-head{
    display:flex;
    align-items:center;
    justify-content:space-between;
    margin-bottom:10px;
  }
  .tf-card-ticker{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:15px;
  }
  .tf-badge{
    font-size:10px;
    color:var(--muted);
    border:1px solid var(--line);
    border-radius:6px;
    padding:1px 7px;
    margin-left:8px;
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .tf-card-rent{
    font-family:'Inter', sans-serif;
    font-weight:700;
    font-size:14px;
  }
  .tf-card-grid{
    display:grid;
    grid-template-columns:repeat(4, 1fr);
    gap:10px;
    margin-bottom:10px;
  }
  .tf-card-field{ min-width:0; }
  .tf-card-field-label{
    font-size:9.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.03em;
  }
  .tf-card-field-value{
    font-family:'Inter', sans-serif;
    font-size:13px;
    margin-top:2px;
  }
  .tf-card-field input{
    background:var(--surface-2);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:3px 6px;
    width:100%;
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    margin-top:2px;
  }
  .tf-card-actions{
    display:flex;
    gap:8px;
    margin-top:8px;
  }
  .tf-card-actions button{
    background:none;
    border:1px solid var(--line);
    color:var(--muted);
    border-radius:7px;
    padding:5px 10px;
    cursor:pointer;
    font-size:11.5px;
  }
  .tf-card-actions button:hover{ color:var(--cold); border-color:var(--cold); }
  .tf-tx-form{
    margin-top:10px;
    padding:10px;
    background:var(--surface-2);
    border-radius:8px;
    display:flex;
    gap:8px;
    flex-wrap:wrap;
    align-items:flex-end;
  }
  .tf-tx-form select, .tf-tx-form input{
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    border-radius:6px;
    padding:5px 8px;
    font-size:12px;
    font-family:'Inter', sans-serif;
  }
  .tf-tx-form label{
    font-size:10px;
    color:var(--muted);
    display:block;
    margin-bottom:3px;
    text-transform:uppercase;
  }
  .tf-tx-form button.confirm{
    background:transparent;
    color:var(--cold);
    border:1px solid var(--cold);
    font-weight:600;
  }
  .tf-tx-form button.confirm:hover{ background:color-mix(in srgb, var(--cold) 12%, transparent); }
  .tf-history{
    margin-top:10px;
    font-size:11.5px;
  }
  .tf-history-row{
    display:flex;
    justify-content:space-between;
    color:var(--muted);
    padding:3px 0;
    border-bottom:1px solid var(--line);
    font-family:'Inter', sans-serif;
  }
  .tf-history-empty{
    color:var(--muted);
    font-size:11.5px;
    font-style:italic;
  }
  .tf-reserve-card{
    background:var(--surface);
    border:1px solid var(--cold);
    border-radius:11px;
    padding:14px 16px;
    margin-bottom:14px;
  }
  .tf-reserve-bars{
    display:flex;
    gap:10px;
    margin-top:10px;
  }
  .tf-reserve-bar{
    flex:1;
    background:var(--surface-2);
    border-radius:8px;
    padding:8px 10px;
  }
  .tf-reserve-bar-label{
    font-size:10px;
    color:var(--muted);
    text-transform:uppercase;
  }
  .tf-reserve-bar-value{
    font-family:'Inter', sans-serif;
    font-size:14px;
    font-weight:700;
    margin-top:2px;
  }
  .tf-reserve-note{
    font-size:11.5px;
    color:var(--muted);
    margin-top:8px;
  }
  #tf-toast{
    position:fixed;
    bottom:24px;
    left:50%;
    transform:translateX(-50%) translateY(80px);
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:10px;
    padding:10px 18px;
    font-size:12.5px;
    display:flex;
    align-items:center;
    gap:8px;
    box-shadow:0 4px 24px rgba(0,0,0,0.4);
    transition:transform .25s ease, opacity .25s ease;
    opacity:0;
    pointer-events:none;
    z-index:9999;
    white-space:nowrap;
  }
  #tf-toast.visible{
    transform:translateX(-50%) translateY(0);
    opacity:1;
  }
  #tf-toast.toast-ok{ border-color:var(--good); color:var(--good); }
  #tf-toast.toast-err{ border-color:var(--hot); color:var(--hot); }
  .tf-dash-section{ margin-bottom:20px; }
  .tf-dash-section-title{
    font-family:'Inter', system-ui, sans-serif;
    font-size:15px;
    font-weight:500;
    margin-bottom:10px;
  }
  .tf-dash-hero{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:16px 18px;
    margin-bottom:18px;
    display:flex;
    align-items:center;
    gap:20px;
    flex-wrap:wrap;
  }
  .tf-dash-hero-value{
    font-family:'Inter', sans-serif;
    font-size:28px;
    font-weight:700;
  }
  .tf-dash-hero-label{
    font-size:11px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.04em;
    margin-bottom:2px;
  }
  .tf-dash-hero-breakdown{
    display:flex;
    gap:16px;
    flex-wrap:wrap;
    font-size:11.5px;
    color:var(--muted);
    font-family:'Inter', sans-serif;
  }
  .tf-dash-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:14px;
    margin-bottom:18px;
  }
  @media (max-width: 620px){ .tf-dash-grid{ grid-template-columns:1fr; } }
  .tf-chart-box{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:12px;
    padding:14px 16px;
  }
  .tf-chart-title{
    font-size:11.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.03em;
    margin-bottom:8px;
  }
  .tf-legend{
    display:flex;
    flex-direction:column;
    gap:6px;
    margin-top:10px;
    font-size:11.5px;
  }
  .tf-legend-row{
    display:flex;
    align-items:center;
    gap:7px;
  }
  .tf-legend-dot{
    width:9px;height:9px;
    border-radius:50%;
    flex-shrink:0;
  }
  .tf-legend-label{ flex:1; color:var(--muted); }
  .tf-legend-value{ font-family:'Inter', sans-serif; color:var(--text); }
  .tf-indicators{
    display:grid;
    grid-template-columns:repeat(auto-fit, minmax(200px, 1fr));
    gap:10px;
  }
  .tf-indicator{
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:10px;
    padding:12px 14px;
  }
  .tf-indicator-label{
    font-size:10.5px;
    color:var(--muted);
    text-transform:uppercase;
    letter-spacing:.03em;
    margin-bottom:4px;
  }
  .tf-indicator-value{
    font-family:'Inter', sans-serif;
    font-size:17px;
    font-weight:700;
  }
  .tf-chart-note{
    font-size:10.5px;
    color:var(--muted);
    margin-top:8px;
    font-style:italic;
  }
  table.tf-table{
    width:100%;
    border-collapse:collapse;
    font-size:12.8px;
  }
  .tf-table th{
    text-align:right;
    color:var(--muted);
    font-weight:500;
    font-size:11px;
    text-transform:uppercase;
    letter-spacing:.04em;
    padding:6px 6px;
    border-bottom:1px solid var(--line);
  }
  .tf-table th:first-child, .tf-table td:first-child{ text-align:left; }
  .tf-table td{
    padding:3px 4px;
    position:relative;
  }
  .tf-table tbody tr{
    background:linear-gradient(to right,
      transparent, var(--line) 32px,
      var(--line) calc(100% - 32px), transparent) no-repeat bottom/100% 1px;
  }
  .tf-table tr.tf-today{
    background:
      linear-gradient(color-mix(in srgb, var(--cold) 8%, transparent), color-mix(in srgb, var(--cold) 8%, transparent)) no-repeat 0 0/100% 100%,
      linear-gradient(to right, transparent, var(--line) 32px, var(--line) calc(100% - 32px), transparent) no-repeat bottom/100% 1px;
  }
  .tf-day{
    color:var(--cold);
    font-family:'Inter', sans-serif;
    width:26px;
  }
  .tf-table input{
    width:100%;
    background:var(--bg);
    border:1px solid var(--line);
    color:var(--text);
    text-align:right;
    font-family:'Inter', sans-serif;
    font-size:12.5px;
    padding:4px 6px;
    border-radius:6px;
  }
  .tf-table input:focus{
    outline:none;
    border-color:var(--cold);
    background:var(--surface);
  }
  .tf-table input.tf-saldo{
    color:var(--text);
    font-weight:700;
    background:transparent;
    border:none;
    padding:4px 2px;
  }
  /* Indicador de nota: pontinho colorido no canto superior direito da célula */
  .tf-has-note::after{
    content:'';
    position:absolute;
    top:3px;
    right:3px;
    width:5px;
    height:5px;
    border-radius:50%;
    background:var(--cold);
    pointer-events:none;
  }
  /* Pista sutil de que dá pra adicionar nota — só aparece no hover, em células que ainda não têm uma */
  .tf-notable:not(.tf-has-note)::after{
    content:'📝';
    position:absolute;
    top:1px;
    right:2px;
    font-size:8px;
    line-height:1;
    opacity:0;
    pointer-events:none;
    transition:opacity .15s;
  }
  .tf-notable:not(.tf-has-note):hover::after{
    opacity:.5;
  }
  /* Tooltip da nota */
  .tf-tooltip{
    position:absolute;
    bottom:calc(100% + 6px);
    right:0;
    background:var(--surface-2);
    border:1px solid var(--cold);
    border-radius:8px;
    padding:6px 10px;
    font-size:11.5px;
    color:var(--text);
    white-space:pre-wrap;
    max-width:220px;
    z-index:1000;
    pointer-events:none;
    box-shadow:0 4px 16px rgba(0,0,0,0.35);
    opacity:0;
    transition:opacity .15s;
  }
  .tf-has-note:hover .tf-tooltip,
  .tf-has-note:focus-within .tf-tooltip{ opacity:1; }
  /* Menu de contexto customizado */
  #tf-ctx-menu{
    position:fixed;
    background:var(--surface-2);
    border:1px solid var(--line);
    border-radius:9px;
    padding:4px 0;
    z-index:9999;
    box-shadow:0 6px 24px rgba(0,0,0,0.45);
    min-width:170px;
    display:none;
  }
  #tf-ctx-menu button{
    display:block;
    width:100%;
    background:none;
    border:none;
    color:var(--text);
    text-align:left;
    padding:8px 14px;
    font-size:12.5px;
    cursor:pointer;
  }
  #tf-ctx-menu button:hover{ background:var(--surface); }
  #tf-ctx-menu hr{ border:none; border-top:1px solid var(--line); margin:3px 0; }
  /* Menu de perfil (avatar + dropdown no header) */
  .tf-profile{ position:relative; }
  .tf-profile-btn{
    display:flex;
    align-items:center;
    gap:7px;
    background:transparent;
    border:1px solid var(--line);
    border-radius:999px;
    padding:3px 10px 3px 3px;
    cursor:pointer;
    color:var(--text);
    font-family:inherit;
  }
  .tf-profile-btn:hover{ background:color-mix(in srgb, var(--text) 7%, transparent); }
  .tf-profile-avatar{
    width:26px;
    height:26px;
    border-radius:50%;
    background:var(--surface-2);
    color:var(--cold);
    display:flex;
    align-items:center;
    justify-content:center;
    font-size:11.5px;
    font-weight:600;
    overflow:hidden;
    flex-shrink:0;
  }
  .tf-profile-avatar img{ width:100%; height:100%; object-fit:cover; }
  .tf-profile-name{ font-size:12.5px; color:var(--muted); }
  .tf-profile-caret{ font-size:9px; color:var(--muted); }
  .tf-profile-menu{
    position:absolute;
    top:calc(100% + 6px);
    right:0;
    width:210px;
    background:var(--surface);
    border:1px solid var(--line);
    border-radius:8px;
    padding:5px;
    box-shadow:0 6px 18px rgba(0,0,0,0.35);
    z-index:900;
    display:none;
  }
  .tf-profile-menu.open{ display:block; }
  .tf-profile-menu-head{
    padding:5px 8px 8px;
    border-bottom:1px solid var(--line);
    margin-bottom:5px;
  }
  .tf-profile-menu-name{ font-size:12.5px; color:var(--text); }
  .tf-profile-menu-email{ font-size:11px; color:var(--muted); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tf-profile-menu-item{
    width:100%;
    text-align:left;
    background:transparent;
    border:none;
    color:var(--text);
    font-size:13px;
    font-family:inherit;
    padding:7px 8px;
    border-radius:6px;

<script>
(function(){
  // Fallback: fora do host que injeta window.storage (extensão/app), usa localStorage.

      async get(key){
        return { value: localStorage.getItem('tf-storage:' + key) };

      async set(key, value){
        localStorage.setItem('tf-storage:' + key, value);
      }
    };
  }

  // ---- Supabase (autenticação) ----
  // Pegue esses dois valores em supabase.com → seu projeto → Settings → API.
  // A anon/public key é segura de expor aqui (não é secreta) — nunca coloque a service_role key.
  const SUPABASE_URL = 'https://cnlbbjntntplxexcihjx.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImNubGJiam50bnRwbHhleGNpaGp4Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODY0NzU2ODgsImV4cCI6MjEwMjA1MTY4OH0.8RTvNYKfVEpBV8ygHFf_lqGSSm-O0goxiBCBewenSw8';
  const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

  // ---- Expressões e Notas ----
  function cellKey(y,m,d,field){ return `${y}-${m}-${d}-${field}`; }

  function setExpr(mo, d, field, expr){
    if (!mo.days[d]) mo.days[d] = { entrada:0, saida:0, diario:0 };
    if (!mo.days[d].exprs) mo.days[d].exprs = {};
    if (expr) mo.days[d].exprs[field] = expr;
    else delete mo.days[d].exprs[field];
  }
  function getExpr(mo, d, field){
    return mo.days[d] && mo.days[d].exprs && mo.days[d].exprs[field] || '';
  }

  function setNote(y,m,d,field,text){
    const mo = getMonth(y,m,true);
    if (!mo.days[d]) mo.days[d] = { entrada:0, saida:0, diario:0 };
    if (!mo.days[d].notes) mo.days[d].notes = {};
    if (text && text.trim()) mo.days[d].notes[field] = text.trim();
    else delete mo.days[d].notes[field];
    saveData();
    render();
  }

  function getNote(mo, d, field){
    return mo.days[d] && mo.days[d].notes && mo.days[d].notes[field] || '';
  }

  // Menu de contexto
  let _ctxTarget = null; // { y,m,d,field }
  const _ctxMenu = document.getElementById('tf-ctx-menu');

  function showCtxMenu(x, y, target){
    _ctxTarget = target;
    _ctxMenu.style.left = Math.min(x, window.innerWidth - 200) + 'px';
    _ctxMenu.style.top = Math.min(y, window.innerHeight - 100) + 'px';
    _ctxMenu.style.display = 'block';
  }
  function hideCtxMenu(){ _ctxMenu.style.display = 'none'; _ctxTarget = null; }

  document.addEventListener('click', (e) => {
    hideCtxMenu();
    const profileEl = document.getElementById('tf-profile');
    if (profileEl && !profileEl.contains(e.target)) closeProfileMenu();
  });
  document.addEventListener('keydown', e => { if (e.key === 'Escape'){ hideCtxMenu(); closeNoteModal(); closeDeleteAccountModal(); closeChangePasswordModal(); closeProfileMenu(); } });

  // Barra +/- pra celular: campos com "calculadora embutida" (soma/desconto direto no
  // campo, ex. "50,00-12,50+8") dependem de digitar +/-, mas o teclado numérico do
  // celular (inputmode="decimal") costuma não ter esses símbolos. A barra aparece
  // fixa embaixo da tela (só em telas touch, via CSS "pointer: coarse") enquanto um
  // desses campos está focado, e insere o símbolo na posição do cursor.
  const _calcBar = document.getElementById('tf-calc-bar');
  let _calcActiveInput = null;
  function isCalcInput(el){
    return el && el.tagName === 'INPUT' && (el.hasAttribute('data-d') || el.id === 'tf-opening-input');
  }
  document.addEventListener('focusin', e => {
    if (isCalcInput(e.target)){
      _calcActiveInput = e.target;
      _calcBar.classList.add('is-visible');
    }
  });
  document.addEventListener('focusout', e => {
    if (e.target === _calcActiveInput){
      setTimeout(() => {
        if (document.activeElement !== _calcActiveInput){
          _calcBar.classList.remove('is-visible');
          _calcActiveInput = null;
        }
      }, 0);
    }
  });
  _calcBar.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('pointerdown', e => e.preventDefault());
    btn.addEventListener('click', () => {
      if (!_calcActiveInput) return;
      const input = _calcActiveInput;
      const op = btn.dataset.op;
      const start = input.selectionStart ?? input.value.length;
      const end = input.selectionEnd ?? input.value.length;
      input.value = input.value.slice(0, start) + op + input.value.slice(end);
      const pos = start + op.length;
      input.setSelectionRange(pos, pos);
      input.dispatchEvent(new Event('input', { bubbles:true }));
    });
  });

  document.getElementById('tf-ctx-add-note').onclick = (e) => {
    e.stopPropagation();
    const target = _ctxTarget;
    hideCtxMenu();
    if (!target) return;
    openNoteModal(target);
  };
  document.getElementById('tf-ctx-remove-note').onclick = (e) => {
    e.stopPropagation();
    const target = _ctxTarget;
    hideCtxMenu();
    if (!target) return;
    const { y, m, d, field } = target;
    setNote(y, m, d, field, '');
  };

  // Modal de nota
  function openNoteModal(target){
    const { y, m, d, field } = target;
    const mo = getMonth(y,m,false) || { days:{} };
    const existing = getNote(mo, d, field);
    document.getElementById('tf-note-textarea').value = existing;
    const modal = document.getElementById('tf-note-modal');
    modal.classList.add('open');
    modal.dataset.y = y; modal.dataset.m = m; modal.dataset.d = d; modal.dataset.field = field;
    setTimeout(() => document.getElementById('tf-note-textarea').focus(), 50);
  }
  function closeNoteModal(){
    document.getElementById('tf-note-modal').classList.remove('open');
  }
  document.getElementById('tf-note-cancel').onclick = closeNoteModal;
  document.getElementById('tf-note-save').onclick = () => {
    const modal = document.getElementById('tf-note-modal');
    const { y, m, d, field } = modal.dataset;
    const text = document.getElementById('tf-note-textarea').value;
    setNote(+y, +m, +d, field, text);
    closeNoteModal();
  };
  document.getElementById('tf-note-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('tf-note-modal')) closeNoteModal();
  });

  // Modal de exclusão de conta
  document.getElementById('tf-delete-account-cancel').onclick = closeDeleteAccountModal;
  document.getElementById('tf-delete-account-confirm').onclick = confirmDeleteAccount;
  document.getElementById('tf-delete-account-confirm-input').onkeydown = (e) => { if (e.key === 'Enter') confirmDeleteAccount(); };
  document.getElementById('tf-delete-account-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('tf-delete-account-modal')) closeDeleteAccountModal();
  });

  // Modal de alteração de senha
  document.getElementById('tf-change-password-cancel').onclick = closeChangePasswordModal;
  document.getElementById('tf-change-password-confirm-btn').onclick = confirmChangePassword;
  document.getElementById('tf-change-password-new').onkeydown = (e) => { if (e.key === 'Enter') document.getElementById('tf-change-password-confirm').focus(); };
  document.getElementById('tf-change-password-confirm').onkeydown = (e) => { if (e.key === 'Enter') confirmChangePassword(); };
  document.getElementById('tf-change-password-modal').addEventListener('click', e => {
    if (e.target === document.getElementById('tf-change-password-modal')) closeChangePasswordModal();
  });
  document.getElementById('tf-avatar-input').onchange = handleAvatarUpload;

  // ---- Autenticação (Supabase Auth) ----
  // E-mail+senha gerenciados pelo Supabase — inclui recuperação de senha (ver resetPassword,
  // ainda não exposta na UI). Os dados ficam protegidos por RLS (cada usuário só acessa a própria
  // linha em user_data) + criptografia em repouso do banco, mas deixaram de ser zero-knowledge:
  // diferente da versão anterior (PBKDF2+AES-GCM local), o backend tecnicamente pode acessar os dados.
  let session = null; // { user, email } depois de login bem-sucedido; null = não logado
  let loginError = '';
  let authTab = 'login'; // 'login' | 'signup' — aba ativa na tela de entrar/criar conta
  let privacyBackTo = 'landing'; // 'landing' | 'login' | 'app' — pra onde o botão Voltar da política de privacidade leva

  function translateAuthError(message){
    const m = (message || '').toLowerCase();
    if (m.includes('invalid login credentials')) return 'E-mail ou senha incorretos.';
    if (m.includes('user already registered')) return 'Esse e-mail já tem conta — use a aba "Entrar".';
    if (m.includes('password should be at least')) return 'A senha precisa ter pelo menos 6 caracteres.';
    if (m.includes('unable to validate email') || m.includes('invalid email')) return 'E-mail inválido.';
    if (m.includes('email not confirmed')) return 'Confirme seu e-mail (link enviado no cadastro) antes de entrar.';
    if (m.includes('rate limit')) return 'Limite de envio de e-mail atingido — espere alguns minutos e tente de novo.';
    if (m.includes('provider is disabled') || m.includes('email_provider_disabled') || m.includes('signups are disabled') || m.includes('logins are disabled')) return 'O login por e-mail está desativado nas configurações do projeto Supabase (Authentication → Providers → Email).';
    return 'Não consegui entrar — tente de novo em instantes.';
  }

  async function doLogin(){
    const email = document.getElementById('tf-login-email').value.trim();
    const pass = document.getElementById('tf-login-pass').value;
    const passConfirmEl = document.getElementById('tf-login-pass-confirm');
    const passConfirm = passConfirmEl ? passConfirmEl.value : null;
    if (!email || !pass){
      loginError = 'Preencha e-mail e senha.';
      renderLogin();
      return;
    }
    if (authTab === 'signup' && pass !== passConfirm){
      loginError = 'As senhas não coincidem.';
      renderLogin();
      return;
    }
    loginError = '';
    try{
      if (authTab === 'signup'){
        const { data, error } = await supabase.auth.signUp({ email, password: pass });
        if (error) throw error;
        if (!data.session){
          authTab = 'login';
          loginError = '';
          renderLogin();
          showToast('Confira seu e-mail pra confirmar a conta antes de entrar');
          return;
        }
        session = { user: data.session.user, email: data.session.user.email };
      } else {
        const { data, error } = await supabase.auth.signInWithPassword({ email, password: pass });
        if (error) throw error;
        session = { user: data.session.user, email: data.session.user.email };
      }
    } catch(e){
      console.error('Falha no login', e);
      session = null;
      loginError = translateAuthError(e.message);
      renderLogin();
      return;
    }
    await loadData();
    await loadInvestments();

  // Foto de perfil: redimensiona no canvas antes de subir, pra não mandar imagens gigantes
  // pro bucket (a foto vira sempre um JPEG quadrado de no máximo 256px de lado).
  function resizeImageToBlob(file, maxSize, quality){
    return new Promise((resolve, reject) => {
      const img = new Image();
      const url = URL.createObjectURL(file);
      img.onload = () => {
        URL.revokeObjectURL(url);
        const scale = Math.min(1, maxSize / Math.max(img.width, img.height));
        const w = Math.round(img.width * scale), h = Math.round(img.height * scale);
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob(blob => blob ? resolve(blob) : reject(new Error('Falha ao processar imagem')), 'image/jpeg', quality);
      };
      img.onerror = () => { URL.revokeObjectURL(url); reject(new Error('Falha ao carregar imagem')); };
      img.src = url;
    });
  }
  async function handleAvatarUpload(e){
    const file = e.target.files && e.target.files[0];
    e.target.value = '';
    if (!file || !session) return;
    closeProfileMenu();
    if (!file.type.startsWith('image/')){
      showToast('Escolha um arquivo de imagem', 'err');
      return;
    }
    try{
      const blob = await resizeImageToBlob(file, 256, 0.82);
      const path = `${session.user.id}/avatar.jpg`;
      const { error: upErr } = await supabase.storage.from('avatars').upload(path, blob, { upsert: true, contentType: 'image/jpeg' });
      if (upErr) throw upErr;
      const { data: pub } = supabase.storage.from('avatars').getPublicUrl(path);
      const avatarUrl = pub.publicUrl + '?t=' + Date.now();
      const { error: updErr } = await supabase.auth.updateUser({ data: { avatar_url: avatarUrl } });
      if (updErr) throw updErr;
      session.user.user_metadata = { ...(session.user.user_metadata || {}), avatar_url: avatarUrl };
      render();
      showToast('Foto de perfil atualizada');
    } catch(err){
      console.error('Falha ao enviar foto de perfil', err);

  }

  // Recalcula qty/PM SEMPRE a partir de baseQty/basePM + histórico (ordenado por data) —
  // assim, editar ou excluir uma transação antiga recalcula tudo certinho, sem precisar de reset.
  function recomputePosition(asset){
    const sorted = [...asset.history].sort((x,y) => x.date < y.date ? -1 : (x.date > y.date ? 1 : 0));
    let qty = asset.baseQty || 0, pm = asset.basePM || 0;
    for (const tx of sorted){
      if (tx.type === 'compra'){
        const newQty = qty + tx.qty;
        pm = newQty > 0 ? Math.round(((qty*pm) + (tx.qty*tx.price)) / newQty * 100) / 100 : tx.price;
        qty = newQty;
      } else {
        qty = Math.max(0, Math.round((qty - tx.qty)*1e6)/1e6);
      }
    }
    return { qty, pm };
  }

  // Quantidade do ativo numa data específica (YYYY-MM-DD) — usa só transações até aquela data.
  // Usado pra reconstruir a evolução do patrimônio investido ao longo do tempo.
  function qtyAsOf(asset, dateStr){
    const sorted = [...asset.history].filter(tx => tx.date <= dateStr).sort((x,y) => x.date < y.date ? -1 : 1);
    let qty = asset.baseQty || 0;
    for (const tx of sorted){
      qty = tx.type === 'compra' ? qty + tx.qty : Math.max(0, qty - tx.qty);
    }
    return qty;
  }

  function fmtBRL(v){
    if (isNaN(v)) v = 0;
    return v.toLocaleString('pt-BR', { style:'currency', currency:'BRL' });

  function monthKey(y,m){ return y + '-' + String(m+1).padStart(2,'0'); }
  function daysInMonth(y,m){ return new Date(y, m+1, 0).getDate(); }
  function prevMonthKey(y,m){ return m===0 ? monthKey(y-1,11) : monthKey(y,m-1); }
  function prevYM(y,m){ return m===0 ? {y:y-1, m:11} : {y, m:m-1}; }

  function emptyMonth(opening){
    return { openingBalance: opening || 0, days: {} };
  }
  function dayEntry(monthObj, d){
    return monthObj.days[d] || { entrada:0, saida:0, diario:0 };
  }

  // Saldo de abertura é sempre calculado a partir do saldo final do mês anterior,
  // encadeado automaticamente até a âncora (set/2024) — nunca precisa ser digitado de novo.
  function getOpeningBalance(y, m){
    if (y === MIN_YEAR && m === MIN_MONTH){
      const key = monthKey(y, m);
      return (state.months[key] && state.months[key].openingBalance) || 0;
    }
    const { y: py, m: pm } = prevYM(y, m);
    const prevOpening = getOpeningBalance(py, pm);
    const prevKey = monthKey(py, pm);
    const prevMonthObj = state.months[prevKey] || { days: {} };
    return computeSaldoForDay(prevMonthObj, daysInMonth(py, pm), prevOpening);
  }

  function getMonth(y,m, createIfMissing){
    const key = monthKey(y,m);
    if (state.months[key]) return state.months[key];
    if (!createIfMissing) return null;
    state.months[key] = emptyMonth(0);
    return state.months[key];
  }

  function computeSaldoForDay(monthObj, d, opening){
    let s = opening || 0;
    for(let i=1;i<=d;i++){
      const e = dayEntry(monthObj,i);
      s += (e.entrada||0) - (e.saida||0) - (e.diario||0);
    }
    return s;
  }

  // Debounced: digitar rápido em várias células dispararia uma escrita de rede por campo,
  // com risco de uma resposta fora de ordem sobrescrever dado mais novo com um mais velho.
  let _saveDataTimer = null;
  function saveData(silent = false){
    clearTimeout(_saveDataTimer);
    return new Promise(resolve => {

  }

  function evalSum(raw){
    if (!raw) return 0;
    const str = String(raw).trim();
    if (!str) return 0;
    const tokens = str.match(/[+-]?[^+-]+/g);
    if (!tokens) return 0;
    let total = 0;
    for (let tok of tokens){
      tok = tok.trim();
      if (!tok) continue;
      let sign = 1;
      if (tok[0] === '-'){ sign = -1; tok = tok.slice(1); }
      else if (tok[0] === '+'){ tok = tok.slice(1); }
      tok = tok.trim().replace(',', '.');
      if (!tok) continue;
      const v = parseFloat(tok);
      if (!isNaN(v)) total += sign * v;
    }
    return Math.round(total * 100) / 100;
  }

  // Reaproveita a mesma tokenização do evalSum só pra achar pedaços que ele
  // silenciosamente trata como 0 (ex: "abc", "R$100", "12x") em vez de somar.
  function findInvalidTokens(raw){
    if (!raw) return [];
    const str = String(raw).trim();
    if (!str) return [];
    const tokens = str.match(/[+-]?[^+-]+/g);
    if (!tokens) return [];
    const invalid = [];
    for (let tok of tokens){
      let cleaned = tok.trim();
      if (!cleaned) continue;
      if (cleaned[0] === '-' || cleaned[0] === '+') cleaned = cleaned.slice(1).trim();
      cleaned = cleaned.replace(',', '.');
      if (!/^\d*\.?\d+$/.test(cleaned)) invalid.push(tok.trim());
    }
    return invalid;
  }

  function warnIfInvalidNumber(raw){
    const invalid = findInvalidTokens(raw);
    if (invalid.length){
      showToast(`Não entendi "${invalid.join(', ')}" no valor digitado — foi ignorado no cálculo`, 'err');
    }
    return invalid.length === 0;
  }

  function setEntry(y,m,d,field,rawValue){
    warnIfInvalidNumber(rawValue);
    const mo = getMonth(y,m,true);
    if (!mo.days[d]) mo.days[d] = { entrada:0, saida:0, diario:0 };
    const computed = evalSum(rawValue);
    mo.days[d][field] = computed;
    // Preserva a expressão bruta se tiver operadores; limpa se for um número simples
    const hasOp = /[+\-]/.test(String(rawValue).replace(/^\s*-?\s*/, '').trim());
    setExpr(mo, d, field, (hasOp && rawValue.trim()) ? rawValue.trim() : '');
    saveData();
    render();
  }

  function setOpening(y,m,value){
    warnIfInvalidNumber(value);
    const mo = getMonth(y,m,true);
    mo.openingBalance = evalSum(value);
    saveData();
    render();
  }

  async function loadInvestments(){
    try{
      const { data, error } = await supabase.from('user_data').select('investments_data').eq('user_id', session.user.id).single();
      if (error) throw error;
      invState = (data.investments_data && Object.keys(data.investments_data).length) ? data.investments_data : { assets:{}, reserve:{} };
    } catch(e){
      console.error('Falha ao carregar investimentos', e);
      invState = { assets:{}, reserve:{}, loaded: true, error: 'Não foi possível carregar seus investimentos. Seus dados salvos não foram apagados — se isso persistir, restaure a partir de um backup exportado.' };
      render();
      return;
    }
    if (!invState.assets) invState.assets = {};
    if (!invState.reserve) invState.reserve = {};
    let merged = false;
    for (const ticker in SEED_INVESTMENTS.assets){
      if (!invState.assets[ticker]){
        invState.assets[ticker] = JSON.parse(JSON.stringify(SEED_INVESTMENTS.assets[ticker]));
        merged = true;
      }
    }
    // Migração: dados salvos antes da refatoração tinham qty/pm direto, sem base.
    for (const ticker in invState.assets){
      const a = invState.assets[ticker];
      if (a.baseQty === undefined){
        a.baseQty = a.qty || 0;
        a.basePM = a.pm || 0;
        delete a.qty;
        delete a.pm;
        merged = true;
      }
      if (!Array.isArray(a.history)) a.history = [];
      a.history.forEach(tx => { if (!tx.id) { tx.id = 'tx_' + Math.random().toString(36).slice(2) + Date.now(); merged = true; } });
      if (!Array.isArray(a.proventos)) { a.proventos = []; merged = true; }
      a.proventos.forEach(p => { if (!p.id) { p.id = 'pv_' + Math.random().toString(36).slice(2) + Date.now(); merged = true; } });
    }
    if (Object.keys(invState.reserve).length === 0){
      invState.reserve = JSON.parse(JSON.stringify(SEED_INVESTMENTS.reserve));
      merged = true;
    }
    if (!Array.isArray(invState.reserve.yieldLog)){
      invState.reserve.yieldLog = [];
      merged = true;
    }
    // Migração: reserva antiga guardava um único "value" e dividia automaticamente pelo limite da turbo.
    // Agora turbo e normal são caixinhas independentes editadas pelo usuário — preserva o total na divisão de migração.
    if (invState.reserve.turboValue === undefined){
      const oldValue = invState.reserve.value || 0;
      invState.reserve.turboValue = Math.min(oldValue, invState.reserve.turboCap);
      invState.reserve.normalValue = Math.max(oldValue - invState.reserve.turboCap, 0);
      delete invState.reserve.value;
      merged = true;
    }
    invState.loaded = true;
    if (merged) await saveInvestments(true);
    render();
  }

  // Data do último export fica só em localStorage puro (não é dado sensível e não depende

  const LAST_BACKUP_KEY = 'tf-last-backup-at';

  function daysSinceLastBackup(){
    const raw = localStorage.getItem(LAST_BACKUP_KEY);
    if (!raw) return null;
    const diffMs = Date.now() - new Date(raw).getTime();
    if (isNaN(diffMs)) return null;
    return Math.floor(diffMs / 86400000);

    const a = document.createElement('a');
    a.href = url;
    a.download = `termometro-backup-${todayISO()}.json`;

  }

  function resetMonth(){
    const key = monthKey(view.year, view.month);
    delete state.months[key];
    confirmingReset = false;
    saveData();
    render();
  }

  function gaugeColorStop(saldo){
    // 0 -> hot, 1500+ -> cold, smooth across mid/warm
    const t = Math.max(0, Math.min(1, saldo / 1500));
    return t;
  }

  function saldoColorVar(saldo){
    if (saldo < -500) return 'var(--saldo-deep-neg)';
    if (saldo < 0) return 'var(--saldo-neg)';
    if (saldo < 900) return 'var(--saldo-neutral)';
    if (saldo < 2000) return 'var(--saldo-pos)';
    return 'var(--saldo-deep-pos)';
  }

  function renderDiario(){
    const app = document.getElementById('tf-app');
    if (!state.loaded){
      app.innerHTML = '<div class="tf-loading">Carregando seus lançamentos...</div>';
      return;
    }
    const { year, month } = view;
    const mo = getMonth(year, month, true);
    const nd = daysInMonth(year, month);
    const isCurrentMonth = (year === today.getFullYear() && month === today.getMonth());
    const opening = getOpeningBalance(year, month);
    const daysSinceBackup = daysSinceLastBackup();
    const backupReminder = (daysSinceBackup === null)
      ? 'Você ainda não exportou um backup.'
      : (daysSinceBackup > BACKUP_REMINDER_DAYS ? `Faz ${daysSinceBackup} dias que você não exporta um backup.` : null);

    let totalEntrada=0, totalSaida=0, totalDiario=0;
    let rows = '';
    for(let d=1; d<=nd; d++){
      const e = dayEntry(mo,d);
      const saldo = computeSaldoForDay(mo,d,opening);
      totalEntrada += e.entrada||0;
      totalSaida += e.saida||0;
      totalDiario += e.diario||0;
      const isToday = isCurrentMonth && d === today.getDate();

      function cellHtml(field, val, label){
        const note = getNote(mo, d, field);
        const hasNote = !!note;
        return `<td class="tf-notable tf-cell-${field} ${hasNote ? 'tf-has-note' : ''}" data-label="${label}">
          <input type="text" inputmode="decimal"
            value="${val?val:''}" placeholder="—"
            data-d="${d}" data-f="${field}"
          >
          ${hasNote ? `<div class="tf-tooltip">${note.replace(/</g,'&lt;')}</div>` : ''}
        </td>`;
      }

      rows += `<tr class="${isToday?'tf-today':''}">
        <td class="tf-day">${d}</td>
        ${cellHtml('entrada', e.entrada, 'Entrada')}
        ${cellHtml('saida', e.saida, 'Saída')}
        ${cellHtml('diario', e.diario, 'Diário')}
        <td class="tf-cell-saldo" data-label="Saldo"><input class="tf-saldo" style="color:${saldoColorVar(saldo)}" value="${fmtBRL(saldo)}" readonly></td>
      </tr>`;
    }

    const finalSaldo = computeSaldoForDay(mo, nd, opening);
    const saidaTotal = totalSaida + totalDiario;
    const performance = totalEntrada - saidaTotal;
    const refDay = isCurrentMonth ? Math.min(today.getDate(), nd) : nd;
    const gaugeSaldo = computeSaldoForDay(mo, refDay, opening);
    const t = gaugeColorStop(gaugeSaldo);
    const maskHeight = (1 - t) * 100;

    app.innerHTML = `
      <div class="tf-head">
        <div>
          <div class="tf-title">Termômetro Financeiro</div>
          <div class="tf-sub">Lançamento diário a partir de setembro/2024 — entradas, saídas e gasto do dia a dia</div>
        </div>
        ${sessionBarHtml()}
      </div>
      ${tabBarHtml()}

      <div class="tf-nav">
        ${!isCurrentMonth ? `<button id="tf-today" class="tf-reset" style="flex-shrink:0;">Hoje</button>` : ''}
        <button id="tf-prev" aria-label="Mês anterior" ${isAtMin(year,month) ? 'disabled style="opacity:.35;cursor:default"' : ''}>‹</button>
        ${monthPickerOpen
          ? `<input type="month" id="tf-month-picker" class="tf-month-picker" value="${monthKey(year,month)}" min="${monthKey(MIN_YEAR,MIN_MONTH)}">`
          : `<button id="tf-month-label-btn" class="tf-month-label">${MONTH_NAMES[month]} de ${year}</button>`
        }
        <button id="tf-next" aria-label="Próximo mês">›</button>
      </div>

      <div class="tf-main">
        <div class="tf-gauge-col">
          <div class="tf-gauge">
            <div class="tf-gauge-mask" style="height:${maskHeight}%"></div>
          </div>
          <div class="tf-gauge-value">${fmtBRL(gaugeSaldo)}</div>
          <div class="tf-gauge-label">${isCurrentMonth ? 'saldo hoje' : 'saldo no fim do mês'}</div>
        </div>

        <div class="tf-body">
          <div class="tf-opening">
            Saldo de abertura do mês:
            ${isAtMin(year,month)
              ? `<input id="tf-opening-input" type="text" inputmode="decimal" value="${mo.openingBalance||0}">`
              : `<span class="tf-opening-auto">${fmtBRL(opening)}</span><span class="tf-opening-auto-note">calculado automaticamente a partir do saldo final de ${MONTH_NAMES[prevYM(year,month).m]}/${prevYM(year,month).y}</span>`
            }
          </div>
          <div class="tf-hint">Dica: dá pra fazer conta direto no campo — soma com <strong>+</strong> e desconto/correção com <strong>-</strong>, ex. <strong>50,00-12,50+8</strong> — ele calcula sozinho ao sair do campo.</div>
          <div class="tf-hint">Dica: clique com o botão direito numa célula (ou segure pressionado no celular) pra adicionar uma nota — células com nota mostram um <span style="color:var(--cold)">●</span> no canto.</div>

          <div class="tf-table-wrap">
            <table class="tf-table">
              <thead>
                <tr><th>Dia</th><th>Entrada</th><th>Saída</th><th>Diário</th><th>Saldo</th></tr>
              </thead>
              <tbody>${rows}</tbody>
            </table>
          </div>

          <div class="tf-summary">
            <div class="tf-pill"><div class="tf-pill-label">Entradas</div><div class="tf-pill-value" style="color:var(--good)">${fmtBRL(totalEntrada)}</div></div>
            <div class="tf-pill"><div class="tf-pill-label">Saídas</div><div class="tf-pill-value" style="color:var(--hot)">${fmtBRL(totalSaida)}</div></div>
            <div class="tf-pill"><div class="tf-pill-label">Diário</div><div class="tf-pill-value" style="color:var(--warm)">${fmtBRL(totalDiario)}</div></div>
            <div class="tf-pill"><div class="tf-pill-label">Saldo final</div><div class="tf-pill-value">${fmtBRL(finalSaldo)}</div></div>
          </div>
          <div class="tf-summary">
            <div class="tf-pill"><div class="tf-pill-label">Saída Total (Saída + Diário)</div><div class="tf-pill-value" style="color:var(--hot)">${fmtBRL(saidaTotal)}</div></div>
            <div class="tf-pill"><div class="tf-pill-label">Performance (Entradas − Saída Total)</div><div class="tf-pill-value" style="color:${performance>=0?'var(--good)':'var(--hot)'}">${fmtBRL(performance)}</div></div>
          </div>
        </div>
      </div>

      <div class="tf-footer-bar">
        <span${backupReminder ? ` style="color:var(--warm)"` : ''}>${backupReminder || 'Dados salvos só na sua conta — ninguém mais vê isso.'}</span>
        <div style="display:flex;gap:8px;align-items:center;">
          <button class="tf-reset" id="tf-export-btn">⬇ Exportar backup</button>
          <button class="tf-reset" id="tf-import-btn">⬆ Importar backup</button>
          <input type="file" id="tf-import-file" accept="application/json" style="display:none">
          ${confirmingReset
            ? `<div class="tf-confirm">
                 <span>Apagar lançamentos deste mês?</span>
                 <button class="yes" id="tf-reset-yes">Apagar</button>
                 <button class="no" id="tf-reset-no">Cancelar</button>
               </div>`
            : `<button class="tf-reset" id="tf-reset-btn">Limpar mês</button>`
          }
        </div>
      </div>
    `;

    document.getElementById('tf-prev').onclick = () => changeMonth(-1);
    document.getElementById('tf-next').onclick = () => changeMonth(1);
    const monthLabelBtn = document.getElementById('tf-month-label-btn');
    if (monthLabelBtn) monthLabelBtn.onclick = openMonthPicker;
    const monthPicker = document.getElementById('tf-month-picker');
    if (monthPicker){
      monthPicker.onchange = (ev) => {
        const [py, pm] = ev.target.value.split('-').map(Number);
        if (py && pm) goToMonth(py, pm - 1);
      };
      monthPicker.onblur = () => { monthPickerOpen = false; render(); };
    }
    const todayBtn = document.getElementById('tf-today');
    if (todayBtn) todayBtn.onclick = () => goToMonth(today.getFullYear(), today.getMonth());
    const openingInput = document.getElementById('tf-opening-input');
    if (openingInput) openingInput.onchange = (ev) => setOpening(year, month, ev.target.value);

    document.getElementById('tf-export-btn').onclick = exportBackup;
    document.getElementById('tf-import-btn').onclick = () => document.getElementById('tf-import-file').click();
    document.getElementById('tf-import-file').onchange = (ev) => {
      const file = ev.target.files[0];
      if (file) importBackup(file);
    };

    if (confirmingReset){
      document.getElementById('tf-reset-yes').onclick = resetMonth;
      document.getElementById('tf-reset-no').onclick = () => { confirmingReset = false; render(); };
    } else {
      document.getElementById('tf-reset-btn').onclick = () => { confirmingReset = true; render(); };
    }

    app.querySelectorAll('input[data-d]').forEach(inp => {
      const d = +inp.dataset.d, field = inp.dataset.f;
      let edited = false;

      inp.oninput = () => { edited = true; };

      // Ao focar: mostra a expressão bruta se existir (persistida nos dados do dia)
      inp.onfocus = () => {
        const expr = getExpr(mo, d, field);
        if (expr) inp.value = expr;
      };

      // Ao sair: só salva se o usuário realmente digitou algo; sempre redesenha mostrando o total
      inp.onblur = (ev) => {
        if (edited) setEntry(year, month, d, field, ev.target.value);
        else render();
      };

      // Clique direito: abre menu de contexto de nota
      inp.oncontextmenu = (ev) => {
        ev.preventDefault();
        showCtxMenu(ev.clientX, ev.clientY, { y: year, m: month, d, field });
      };

      // Mobile: pressionar e segurar (touchstart 600ms) abre o menu
      let _touchTimer;
      inp.addEventListener('touchstart', ev => {
        _touchTimer = setTimeout(() => {
          ev.preventDefault();
          const t = ev.touches[0];
          showCtxMenu(t.clientX, t.clientY, { y: year, m: month, d, field });
        }, 600);
      });
      inp.addEventListener('touchend', () => clearTimeout(_touchTimer));
      inp.addEventListener('touchmove', () => clearTimeout(_touchTimer));
    });

    wireTabs();
  }

  function fmtPct(v){
    const sign = v > 0 ? '+' : '';
    return sign + v.toLocaleString('pt-BR', { minimumFractionDigits:2, maximumFractionDigits:2 }) + '%';
  }

  function renderInvestimentos(){
    const app = document.getElementById('tf-app');
    if (!invState.loaded){
      app.innerHTML = '<div class="tf-loading">Carregando seus investimentos...</div>';
      return;
    }

    const tickers = Object.keys(invState.assets).sort((a,b) => {
      const ka = invState.assets[a].kind, kb = invState.assets[b].kind;
      const oa = KIND_ORDER[ka] !== undefined ? KIND_ORDER[ka] : 9;
      const ob = KIND_ORDER[kb] !== undefined ? KIND_ORDER[kb] : 9;
      if (oa !== ob) return oa - ob;
      return a.localeCompare(b);
    });
    let totalInvestido = 0, totalAtual = 0;
    const cardsHtml = tickers.map(ticker => {
      const a = invState.assets[ticker];
      const { qty, pm } = recomputePosition(a);
      const valorInvestido = qty * pm;
      const valorAtual = qty * a.price;
      const rent = valorInvestido > 0 ? ((valorAtual - valorInvestido) / valorInvestido) * 100 : 0;
      totalInvestido += valorInvestido;
      totalAtual += valorAtual;
      const rentColor = rent >= 0 ? 'var(--good)' : 'var(--hot)';

      const formHtml = invOpenForm === ticker ? `
        <div class="tf-tx-form">
          <div><label>Tipo</label>
            <select id="tf-tx-type-${ticker}">
              <option value="compra">Compra</option>
              <option value="venda">Venda</option>
            </select>
          </div>
          <div><label>Qtd</label><input id="tf-tx-qty-${ticker}" type="text" inputmode="decimal" placeholder="0" style="width:70px"></div>
          <div><label>Preço</label><input id="tf-tx-price-${ticker}" type="text" inputmode="decimal" placeholder="0,00" style="width:80px"></div>
          <button class="confirm" id="tf-tx-confirm-${ticker}">Registrar</button>
        </div>` : '';

      const sortedHist = [...a.history].sort((x,y) => x.date < y.date ? 1 : -1); // mais recente primeiro
      const histList = sortedHist.length === 0
        ? `<div class="tf-history-empty">Sem movimentações registradas ainda.</div>`
        : sortedHist.map(h => {
            const isEditing = invEditingTx && invEditingTx.ticker === ticker && invEditingTx.id === h.id;
            if (isEditing){
              return `<div class="tf-tx-form" style="margin:4px 0;">
                <div><label>Data</label><input id="tf-edit-date" type="date" value="${h.date}" style="width:120px"></div>
                <div><label>Tipo</label>
                  <select id="tf-edit-type">
                    <option value="compra" ${h.type==='compra'?'selected':''}>Compra</option>
                    <option value="venda" ${h.type==='venda'?'selected':''}>Venda</option>
                  </select>
                </div>
                <div><label>Qtd</label><input id="tf-edit-qty" type="text" inputmode="decimal" value="${h.qty}" style="width:60px"></div>
                <div><label>Preço</label><input id="tf-edit-price" type="text" inputmode="decimal" value="${h.price}" style="width:75px"></div>
                <button class="confirm" data-save-edit="${h.id}">Salvar</button>
                <button data-cancel-edit style="background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:11.5px;">Cancelar</button>
              </div>`;
            }
            const isDeletingTx = invConfirmingDeleteTx && invConfirmingDeleteTx.ticker === ticker && invConfirmingDeleteTx.id === h.id;
            return `<div class="tf-history-row">
              <span>${h.date}</span><span>${h.type === 'compra' ? 'Compra' : 'Venda'}</span><span>${h.qty} cotas/ações</span><span>${fmtBRL(h.price)}</span>
              <span style="display:flex;gap:6px;align-items:center;">
                ${isDeletingTx
                  ? `<span style="color:var(--hot)">Excluir?</span>
                     <button data-del-tx-yes="${ticker}|${h.id}" style="background:none;border:none;color:var(--hot);cursor:pointer;font-size:11px;font-weight:700;">sim</button>
                     <button data-del-tx-no style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;">não</button>`
                  : `<button data-edit-tx="${ticker}|${h.id}" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;">editar</button>
                     <button data-del-tx="${ticker}|${h.id}" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;">excluir</button>`
                }
              </span>
            </div>`;
          }).join('');
      // --- Proventos ---
      const totalProv = a.proventos.reduce((s,p) => s + p.total, 0);
      const yieldOnCost = valorInvestido > 0 ? (totalProv / valorInvestido) * 100 : 0;
      const provSorted = [...a.proventos].sort((x,y) => x.date < y.date ? 1 : -1);

      const provFormHtml = invProvFormOpen[ticker] ? `
        <div class="tf-tx-form">
          <div><label>Data pgto</label><input id="tf-pv-date-${ticker}" type="date" value="${todayISO()}" style="width:130px"></div>
          <div><label>R$/cota</label><input id="tf-pv-valor-${ticker}" type="text" inputmode="decimal" placeholder="0,00" style="width:80px"></div>
          <button class="confirm" data-pv-confirm="${ticker}">Registrar</button>
        </div>` : '';

      const provRows = provSorted.length === 0
        ? `<div class="tf-history-empty">Nenhum provento registrado ainda.</div>`
        : provSorted.map(p => {
            const isEditing = invEditingProv && invEditingProv.ticker === ticker && invEditingProv.id === p.id;
            if (isEditing){
              return `<div class="tf-tx-form" style="margin:4px 0;">
                <div><label>Data</label><input id="tf-pv-edit-date" type="date" value="${p.date}" style="width:130px"></div>
                <div><label>R$/cota</label><input id="tf-pv-edit-valor" type="text" inputmode="decimal" value="${p.valorCota}" style="width:80px"></div>
                <button class="confirm" data-pv-save-edit="${p.id}">Salvar</button>
                <button data-pv-cancel-edit style="background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:11.5px;">Cancelar</button>
              </div>`;
            }
            const isDeletingProv = invConfirmingDeleteProv && invConfirmingDeleteProv.ticker === ticker && invConfirmingDeleteProv.id === p.id;
            return `<div class="tf-history-row">
              <span>${p.date}</span>
              <span style="color:var(--muted)">${p.qtyCota} cotas</span>
              <span>${fmtBRL(p.valorCota)}/cota</span>

                ${isDeletingProv

                     <button data-pv-del-yes="${ticker}|${p.id}" style="background:none;border:none;color:var(--hot);cursor:pointer;font-size:11px;font-weight:700;">sim</button>
                     <button data-pv-del-no style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;">não</button>`
                  : `<button data-pv-edit="${ticker}|${p.id}" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;">editar</button>
                     <button data-pv-del="${ticker}|${p.id}" style="background:none;border:none;color:var(--muted);cursor:pointer;font-size:11px;">excluir</button>`

              </span>
            </div>`;

      const proventosHtml = invProvHistOpen[ticker] ? `
        <div class="tf-history">${provRows}</div>` : '';

      const historyHtml = invHistoryOpen[ticker] ? `
        <div class="tf-history">${histList}</div>
        ${a.history.length > 0 ? (
          invConfirmingReset === ticker
            ? `<div class="tf-confirm" style="margin-top:8px;">
                 <span style="font-size:11.5px;color:var(--muted);">Apagar todo o histórico e voltar pra posição inicial (${a.baseQty} cotas/ações, PM ${fmtBRL(a.basePM)})?</span>
                 <button class="yes" data-reset-yes="${ticker}">Apagar</button>
                 <button class="no" data-reset-no>Cancelar</button>
               </div>`
            : `<button data-reset-hist="${ticker}" style="margin-top:8px;background:none;border:1px solid var(--line);color:var(--muted);border-radius:7px;padding:5px 10px;cursor:pointer;font-size:11.5px;">Resetar histórico</button>`
        ) : ''}
      ` : '';

      return `<div class="tf-card">

          <div><span class="tf-card-ticker">${ticker}</span><span class="tf-badge">${a.kind}</span></div>

        <div class="tf-card-actions">

        <div style="border-top:1px solid var(--line);margin-top:10px;padding-top:10px;">
          <div style="display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:6px;margin-bottom:6px;">
            <div>
              <span style="font-size:10.5px;color:var(--muted);text-transform:uppercase;letter-spacing:.03em;">Proventos recebidos</span>

    const r = invState.reserve;

    const excedeuTurbo = r.turboValue > r.turboCap;

      ? `<div class="tf-history-empty">Nenhum rendimento registrado ainda.</div>`
      : r.yieldLog.map(e => `<div class="tf-history-row">
          <span>${fmtMonthLabel(e.month)}</span><span style="color:var(--good)">+${fmtBRL(e.amount)}</span>

    const yieldFormHtml = reserveFormOpen ? `

  // ---- Dashboard ----
  function buildLineChartSVG(points, seriesList, width, height){
    const padL = 8, padR = 8, padT = 14, padB = 18;
    const innerW = width - padL - padR, innerH = height - padT - padB;
    const allVals = seriesList.flatMap(s => s.values);
    let min = Math.min(0, ...allVals), max = Math.max(...allVals, 1);
    if (max === min) max = min + 1;
    const range = max - min;
    const n = points.length;
    const stepX = n > 1 ? innerW / (n - 1) : 0;
    const xAt = i => padL + i * stepX;
    const yAt = v => padT + innerH - ((v - min) / range) * innerH;
    const zeroY = yAt(0);

    let lastRealIdx = -1;
    points.forEach((p,i) => { if (!p.isFuture) lastRealIdx = i; });
    if (lastRealIdx === -1) lastRealIdx = n - 1;

    let linesSvg = '';
    seriesList.forEach(s => {
      const solid = s.values.slice(0, lastRealIdx + 1).map((v,i) => `${xAt(i)},${yAt(v)}`).join(' ');
      const future = s.values.slice(lastRealIdx).map((v,i) => `${xAt(i + lastRealIdx)},${yAt(v)}`).join(' ');
      linesSvg += `<polyline points="${solid}" fill="none" style="stroke:${s.color}" stroke-width="${s.width||2}"></polyline>`;
      linesSvg += `<polyline points="${future}" fill="none" style="stroke:${s.color}" stroke-width="${(s.width||2)*0.85}" stroke-dasharray="4,3" opacity="0.7"></polyline>`;
      if (s.dots){
        linesSvg += s.values.slice(0, lastRealIdx + 1).map((v,i) =>
          `<circle cx="${xAt(i)}" cy="${yAt(v)}" r="2" style="fill:${s.color}"></circle>`
        ).join('');
      }
    });

    const labelEvery = Math.max(1, Math.ceil(n / 7));
    let labels = '';
    points.forEach((p,i) => {
      if (i % labelEvery === 0 || i === n-1){
        labels += `<text x="${xAt(i)}" y="${height-4}" font-size="8.5" fill="var(--muted)" text-anchor="middle" font-family="Inter, sans-serif">${MONTH_NAMES[p.m].slice(0,3)}/${String(p.y).slice(2)}</text>`;
      }
    });

    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
      <line x1="${padL}" y1="${zeroY}" x2="${width-padR}" y2="${zeroY}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2,3"></line>
      ${linesSvg}
      ${labels}
    </svg>`;
  }

  function buildDonutSVG(segments, size){
    const r = size/2 - 4, cx = size/2, cy = size/2, innerR = r * 0.56;
    const total = segments.reduce((s,seg) => s + Math.max(seg.value,0), 0) || 1;
    let angle = -Math.PI/2;
    let paths = '';
    segments.forEach(seg => {
      const frac = Math.max(seg.value,0) / total;
      if (frac <= 0.0005) return;
      const sweep = frac * Math.PI * 2;
      const a0 = angle, a1 = angle + sweep - 0.012; // pequeno gap entre fatias
      const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
      const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
      const ix0 = cx + innerR*Math.cos(a1), iy0 = cy + innerR*Math.sin(a1);
      const ix1 = cx + innerR*Math.cos(a0), iy1 = cy + innerR*Math.sin(a0);
      const largeArc = (sweep > Math.PI) ? 1 : 0;
      paths += `<path d="M${x0},${y0} A${r},${r} 0 ${largeArc} 1 ${x1},${y1} L${ix0},${iy0} A${innerR},${innerR} 0 ${largeArc} 0 ${ix1},${iy1} Z" style="fill:${seg.color}"></path>`;
      angle += sweep;
    });
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}</svg>`;
  }

  function getMonthlySeries(){
    const keys = Object.keys(state.months).filter(k => Object.keys(state.months[k].days||{}).length > 0).sort();
    return keys.map(key => {
      const [y, mm] = key.split('-').map(Number);
      const m = mm - 1;
      const mo = state.months[key];
      const nd = daysInMonth(y, m);
      const opening = getOpeningBalance(y, m);
      let totalEntrada=0, totalSaida=0, totalDiario=0;
      for (let d=1; d<=nd; d++){
        const e = dayEntry(mo, d);
        totalEntrada += e.entrada||0; totalSaida += e.saida||0; totalDiario += e.diario||0;
      }
      const saldoFinal = computeSaldoForDay(mo, nd, opening);
      const saidaTotal = totalSaida + totalDiario;
      const performance = totalEntrada - saidaTotal;
      const isFuture = (y > today.getFullYear()) || (y === today.getFullYear() && m > today.getMonth());
      const dateEnd = `${y}-${String(mm).padStart(2,'0')}-${String(nd).padStart(2,'0')}`;
      return { key, y, m, saldoFinal, saidaTotal, performance, isFuture, dateEnd };
    });
  }

        </div>
      </div>

      <div class="tf-dash-section">
        <div class="tf-dash-section-title">Indicadores</div>
        <div class="tf-indicators">
          <div class="tf-indicator">
            <div class="tf-indicator-label">Gasto médio mensal</div>
            <div class="tf-indicator-value" style="color:var(--hot)">${fmtBRL(avgGasto)}</div>
          </div>
          <div class="tf-indicator">
            <div class="tf-indicator-label">Meses com performance positiva</div>
            <div class="tf-indicator-value" style="color:${pctPositive>=50?'var(--good)':'var(--warm)'}">${pctPositive.toFixed(0)}%</div>
          </div>
          <div class="tf-indicator">
            <div class="tf-indicator-label">Rentabilidade ponderada da carteira</div>
            <div class="tf-indicator-value" style="color:${rentPonderada>=0?'var(--good)':'var(--hot)'}">${fmtPct(rentPonderada)}</div>
          </div>
          <div class="tf-indicator">
            <div class="tf-indicator-label">Rendimento acumulado da reserva</div>
            <div class="tf-indicator-value" style="color:var(--good)">${fmtBRL(totalRendimentos)}</div>
          </div>
          <div class="tf-indicator">
            <div class="tf-indicator-label">Proventos acumulados (carteira)</div>
            <div class="tf-indicator-value" style="color:var(--good)">${fmtBRL(totalProventos)}</div>
          </div>
          <div class="tf-indicator">
            <div class="tf-indicator-label">Provento médio mensal</div>
            <div class="tf-indicator-value" style="color:var(--good)">${fmtBRL(provMedioMensal)}</div>
          </div>
        </div>
      </div>
    `;

    wireTabs();
  }

  function renderErrorScreen(message){
    const app = document.getElementById('tf-app');
    app.innerHTML = `
      <div class="tf-head">
        <div><div class="tf-title">Termômetro Financeiro</div></div>
        ${sessionBarHtml()}
      </div>
      ${tabBarHtml()}
      <div class="tf-error">⚠ ${message}<br><br><button class="tf-reset" id="tf-error-retry">Tentar novamente</button></div>
    `;
    wireTabs();
    document.getElementById('tf-error-retry').onclick = () => location.reload();
  }

  function render(){
    document.title = `Termômetro Financeiro - ${TAB_LABELS[activeTab]}`;
    if (activeTab === 'diario' && state.error) return renderErrorScreen(state.error);
    if (activeTab === 'investimentos' && invState.error) return renderErrorScreen(invState.error);
    if (activeTab === 'dashboard' && (state.error || invState.error)) return renderErrorScreen(state.error || invState.error);
    if (activeTab === 'investimentos') renderInvestimentos();
    else if (activeTab === 'dashboard') renderDashboard();
    else renderDiario();
  }

  boot();
})();</script>
