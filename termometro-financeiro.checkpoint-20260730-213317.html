    app.querySelectorAll('button[data-pv-del]').forEach(btn => {
      btn.onclick = () => {
        const [ticker, id] = btn.dataset.pvDel.split('|');
        askDeleteProv(ticker, id);
      };
    });
    app.querySelectorAll('button[data-pv-del-yes]').forEach(btn => {
      btn.onclick = () => {
        const [ticker, id] = btn.dataset.pvDelYes.split('|');
        deleteProv(ticker, id);
      };
    });
    app.querySelectorAll('button[data-pv-del-no]').forEach(btn => {
      btn.onclick = cancelDeleteProv;
    });
    app.querySelectorAll('button[data-pv-save-edit]').forEach(btn => {
      btn.onclick = () => {
        const id = btn.dataset.pvSaveEdit;

          document.getElementById('tf-pv-edit-valor').value

    app.querySelectorAll('button[data-pv-cancel-edit]').forEach(btn => {
      btn.onclick = cancelEditProv;

    // Rendimento mensal da reserva
    document.getElementById('tf-yield-toggle').onclick = toggleReserveForm;

      yieldConfirm.onclick = () => {

    // Novo ativo
    document.getElementById('tf-new-asset-toggle').onclick = toggleNewAssetForm;
    const naTicker = document.getElementById('tf-na-ticker');
    if (naTicker){
      naTicker.oninput = () => {
        const kind = detectKind(naTicker.value);
        const sel = document.getElementById('tf-na-kind');
        if (sel && naTicker.value.trim()) sel.value = kind;
      };
    }
    const naConfirm = document.getElementById('tf-na-confirm');
    if (naConfirm){
      naConfirm.onclick = () => {
        const ticker = document.getElementById('tf-na-ticker').value;
        const kind = document.getElementById('tf-na-kind').value;
        const qty = document.getElementById('tf-na-qty').value;
        const pm = document.getElementById('tf-na-pm').value;
        const price = document.getElementById('tf-na-price').value;
        addNewAsset(ticker, kind, qty, pm, price);
      };
    }
  }

  // ---- Dashboard ----
  function buildLineChartSVG(points, seriesList, width, height){
    const padL = 8, padR = 8, padT = 14, padB = 18;
    const innerW = width - padL - padR, innerH = height - padT - padB;
    const allVals = seriesList.flatMap(s => s.values);
    let min = Math.min(0, ...allVals), max = Math.max(...allVals, 1);
    if (max === min) max = min + 1;
    const range = max - min;
    const n = points.length;
    const stepX = n > 1 ? innerW / (n - 1) : 0;
    const xAt = i => padL + i * stepX;
    const yAt = v => padT + innerH - ((v - min) / range) * innerH;
    const zeroY = yAt(0);

    let lastRealIdx = -1;
    points.forEach((p,i) => { if (!p.isFuture) lastRealIdx = i; });
    if (lastRealIdx === -1) lastRealIdx = n - 1;

    let linesSvg = '';
    seriesList.forEach(s => {
      const solid = s.values.slice(0, lastRealIdx + 1).map((v,i) => `${xAt(i)},${yAt(v)}`).join(' ');
      const future = s.values.slice(lastRealIdx).map((v,i) => `${xAt(i + lastRealIdx)},${yAt(v)}`).join(' ');
      linesSvg += `<polyline points="${solid}" fill="none" style="stroke:${s.color}" stroke-width="${s.width||2}"></polyline>`;
      linesSvg += `<polyline points="${future}" fill="none" style="stroke:${s.color}" stroke-width="${(s.width||2)*0.85}" stroke-dasharray="4,3" opacity="0.7"></polyline>`;
      if (s.dots){
        linesSvg += s.values.slice(0, lastRealIdx + 1).map((v,i) =>
          `<circle cx="${xAt(i)}" cy="${yAt(v)}" r="2" style="fill:${s.color}"></circle>`
        ).join('');
      }
    });

    const labelEvery = Math.max(1, Math.ceil(n / 7));
    let labels = '';
    points.forEach((p,i) => {
      if (i % labelEvery === 0 || i === n-1){
        labels += `<text x="${xAt(i)}" y="${height-4}" font-size="8.5" fill="var(--muted)" text-anchor="middle" font-family="IBM Plex Mono, monospace">${MONTH_NAMES[p.m].slice(0,3)}/${String(p.y).slice(2)}</text>`;
      }
    });

    return `<svg viewBox="0 0 ${width} ${height}" width="100%" height="${height}">
      <line x1="${padL}" y1="${zeroY}" x2="${width-padR}" y2="${zeroY}" stroke="var(--line)" stroke-width="1" stroke-dasharray="2,3"></line>
      ${linesSvg}
      ${labels}
    </svg>`;
  }

  function buildDonutSVG(segments, size){
    const r = size/2 - 4, cx = size/2, cy = size/2, innerR = r * 0.56;
    const total = segments.reduce((s,seg) => s + Math.max(seg.value,0), 0) || 1;
    let angle = -Math.PI/2;
    let paths = '';
    segments.forEach(seg => {
      const frac = Math.max(seg.value,0) / total;
      if (frac <= 0.0005) return;
      const sweep = frac * Math.PI * 2;
      const a0 = angle, a1 = angle + sweep - 0.012; // pequeno gap entre fatias
      const x0 = cx + r*Math.cos(a0), y0 = cy + r*Math.sin(a0);
      const x1 = cx + r*Math.cos(a1), y1 = cy + r*Math.sin(a1);
      const ix0 = cx + innerR*Math.cos(a1), iy0 = cy + innerR*Math.sin(a1);
      const ix1 = cx + innerR*Math.cos(a0), iy1 = cy + innerR*Math.sin(a0);
      const largeArc = (sweep > Math.PI) ? 1 : 0;
      paths += `<path d="M${x0},${y0} A${r},${r} 0 ${largeArc} 1 ${x1},${y1} L${ix0},${iy0} A${innerR},${innerR} 0 ${largeArc} 0 ${ix1},${iy1} Z" style="fill:${seg.color}"></path>`;
      angle += sweep;
    });
    return `<svg viewBox="0 0 ${size} ${size}" width="${size}" height="${size}">${paths}</svg>`;
  }

  function getMonthlySeries(){
    const keys = Object.keys(state.months).filter(k => Object.keys(state.months[k].days||{}).length > 0).sort();
    return keys.map(key => {
      const [y, mm] = key.split('-').map(Number);
      const m = mm - 1;
      const mo = state.months[key];
      const nd = daysInMonth(y, m);
      const opening = getOpeningBalance(y, m);
      let totalEntrada=0, totalSaida=0, totalDiario=0;
      for (let d=1; d<=nd; d++){
        const e = dayEntry(mo, d);
        totalEntrada += e.entrada||0; totalSaida += e.saida||0; totalDiario += e.diario||0;
      }
      const saldoFinal = computeSaldoForDay(mo, nd, opening);
      const saidaTotal = totalSaida + totalDiario;
      const performance = totalEntrada - saidaTotal;
      const isFuture = (y > today.getFullYear()) || (y === today.getFullYear() && m > today.getMonth());
      const dateEnd = `${y}-${String(mm).padStart(2,'0')}-${String(nd).padStart(2,'0')}`;
      return { key, y, m, saldoFinal, saidaTotal, performance, isFuture, dateEnd };
    });
  }

  function renderDashboard(){
    const app = document.getElementById('tf-app');
    if (!state.loaded || !invState.loaded){
      app.innerHTML = '<div class="tf-loading">Carregando o dashboard...</div>';
      return;
    }

    const series = getMonthlySeries();
    const realSeries = series.filter(p => !p.isFuture);
    const avgGasto = realSeries.length ? realSeries.reduce((s,p) => s+p.saidaTotal, 0) / realSeries.length : 0;
    const pctPositive = realSeries.length ? (realSeries.filter(p => p.performance >= 0).length / realSeries.length) * 100 : 0;

    const tickers = Object.keys(invState.assets);
    let totalInvestido = 0, totalAtual = 0;
    const byKind = {};
    tickers.forEach(t => {
      const a = invState.assets[t];
      const { qty, pm } = recomputePosition(a);
      totalInvestido += qty * pm;
      const va = qty * a.price;
      totalAtual += va;
      byKind[a.kind] = (byKind[a.kind]||0) + va;
    });
    const rentPonderada = totalInvestido > 0 ? ((totalAtual - totalInvestido) / totalInvestido) * 100 : 0;
    const reserveValue = (invState.reserve.turboValue || 0) + (invState.reserve.normalValue || 0);
    const totalRendimentos = (invState.reserve.yieldLog||[]).reduce((s,e) => s+e.amount, 0);
    const totalProventos = tickers.reduce((s,t) => s + (invState.assets[t].proventos||[]).reduce((ps,p) => ps+p.total, 0), 0);
    const provMedioMensal = (() => {
      // pega todos os proventos, agrupa por mês, calcula média
      const byMonth = {};
      tickers.forEach(t => (invState.assets[t].proventos||[]).forEach(p => {
        const key = p.date.slice(0,7);
        byMonth[key] = (byMonth[key]||0) + p.total;
      }));
      const meses = Object.values(byMonth);
      return meses.length ? meses.reduce((s,v)=>s+v,0)/meses.length : 0;
    })();

    const curKey = monthKey(today.getFullYear(), today.getMonth());
    let ledgerToday = realSeries.length ? realSeries[realSeries.length-1].saldoFinal : 0;
    if (state.months[curKey]){
      const openingCur = getOpeningBalance(today.getFullYear(), today.getMonth());
      ledgerToday = computeSaldoForDay(state.months[curKey], today.getDate(), openingCur);
    }
    const patrimonioTotal = ledgerToday + totalAtual + reserveValue;

    // Investido (a preço de hoje) e patrimônio combinado em cada mês — reconstruído via
    // qtyAsOf (replay do histórico de transações até a data) × preço atual. Reserva é
    // aplicada como valor constante de hoje, já que não há histórico de saldo da caixinha.
    const investSeries = series.map(p => tickers.reduce((s,t) => {
      const a = invState.assets[t];
      return s + qtyAsOf(a, p.dateEnd) * a.price;
    }, 0));
    const patrimonioSeries = series.map((p,i) => p.saldoFinal + investSeries[i] + reserveValue);
    const ledgerSeries = series.map(p => p.saldoFinal);

    const pieSegments = [
      { label:'Conta corrente', value: Math.max(ledgerToday,0), color:'#38BDF8' },
      { label:'FIIs', value: byKind['FII']||0, color:'#34D399' },
      { label:'Ações', value: byKind['Ação']||0, color:'#FBBF24' },
      { label:'Outros ativos', value: Math.max(totalAtual - (byKind['FII']||0) - (byKind['Ação']||0), 0), color:'#A78BFA' },
      { label:'Reserva', value: reserveValue, color:'#F472B6' }
    ].filter(s => s.value > 0.01);
    const pieTotal = pieSegments.reduce((s,seg) => s+seg.value, 0) || 1;

    const maxScale = Math.max(5000, Math.ceil((patrimonioTotal*1.3) / 1000) * 1000);
    const gaugeT = Math.max(0, Math.min(1, patrimonioTotal / maxScale));
    const gaugeMask = (1 - gaugeT) * 100;

    const lineChart = series.length >= 2
      ? buildLineChartSVG(series, [
          { values: patrimonioSeries, color: 'var(--cold)', width: 2.4, dots: true },
          { values: ledgerSeries, color: 'var(--muted)', width: 1.4, dots: false }
        ], 560, 170)
      : `<div class="tf-history-empty">Sem meses suficientes pra plotar ainda.</div>`;

    const legendHtml = pieSegments.map(seg => `
      <div class="tf-legend-row">
        <span class="tf-legend-dot" style="background:${seg.color}"></span>
        <span class="tf-legend-label">${seg.label}</span>
        <span class="tf-legend-value">${fmtBRL(seg.value)} · ${((seg.value/pieTotal)*100).toFixed(1)}%</span>
      </div>`).join('');

    app.innerHTML = `
      <div class="tf-head">
        <div>
          <div class="tf-title">Termômetro Financeiro</div>
          <div class="tf-sub">Dashboard — visão consolidada de diário, investimentos e reserva</div>
        </div>
        ${sessionBarHtml()}
      </div>
      ${tabBarHtml()}

      <div class="tf-dash-hero">
        <div class="tf-gauge-col" style="width:60px;">
          <div class="tf-gauge" style="height:140px;width:24px;">
            <div class="tf-gauge-mask" style="height:${gaugeMask}%"></div>
          </div>
        </div>
        <div>
          <div class="tf-dash-hero-label">Patrimônio total hoje</div>
          <div class="tf-dash-hero-value">${fmtBRL(patrimonioTotal)}</div>
          <div class="tf-dash-hero-breakdown">
            <span>Conta: ${fmtBRL(ledgerToday)}</span>
            <span>Investido: ${fmtBRL(totalAtual)}</span>
            <span>Reserva: ${fmtBRL(reserveValue)}</span>
          </div>
        </div>
      </div>

      <div class="tf-dash-grid">
        <div class="tf-chart-box">
          <div class="tf-chart-title">Patrimônio total — evolução mensal</div>
          ${lineChart}
          <div class="tf-legend" style="flex-direction:row; gap:16px; margin-top:4px;">
            <div class="tf-legend-row" style="flex:none;"><span class="tf-legend-dot" style="background:var(--cold)"></span><span class="tf-legend-label" style="flex:none;">Patrimônio total</span></div>
            <div class="tf-legend-row" style="flex:none;"><span class="tf-legend-dot" style="background:var(--muted)"></span><span class="tf-legend-label" style="flex:none;">Só conta corrente</span></div>
          </div>
          <div class="tf-chart-note">Linha sólida = meses reais, pontilhada = projeção (2027). Investimentos e reserva usam preço/valor de <strong>hoje</strong> aplicado retroativamente à quantidade de cada época (via histórico de transações) — mostra quanto aquele momento valeria hoje, não o valor real da época.</div>
        </div>
        <div class="tf-chart-box">
          <div class="tf-chart-title">Alocação atual do patrimônio</div>
          <div style="display:flex; align-items:center; gap:16px;">
            ${buildDonutSVG(pieSegments, 120)}
            <div class="tf-legend" style="flex:1; margin-top:0;">${legendHtml}</div>
          </div>
        </div>
      </div>

      <div class="tf-dash-section">
        <div class="tf-dash-section-title">Indicadores</div>
        <div class="tf-indicators">
          <div class="tf-indicator">
            <div class="tf-indicator-label">Gasto médio mensal</div>
            <div class="tf-indicator-value" style="color:var(--hot)">${fmtBRL(avgGasto)}</div>
          </div>
          <div class="tf-indicator">
            <div class="tf-indicator-label">Meses com performance positiva</div>
            <div class="tf-indicator-value" style="color:${pctPositive>=50?'var(--good)':'var(--warm)'}">${pctPositive.toFixed(0)}%</div>
          </div>
          <div class="tf-indicator">
            <div class="tf-indicator-label">Rentabilidade ponderada da carteira</div>
            <div class="tf-indicator-value" style="color:${rentPonderada>=0?'var(--good)':'var(--hot)'}">${fmtPct(rentPonderada)}</div>
          </div>
          <div class="tf-indicator">
            <div class="tf-indicator-label">Rendimento acumulado da reserva</div>
            <div class="tf-indicator-value" style="color:var(--good)">${fmtBRL(totalRendimentos)}</div>
          </div>
          <div class="tf-indicator">
            <div class="tf-indicator-label">Proventos acumulados (carteira)</div>
            <div class="tf-indicator-value" style="color:var(--good)">${fmtBRL(totalProventos)}</div>
          </div>
          <div class="tf-indicator">
            <div class="tf-indicator-label">Provento médio mensal</div>
            <div class="tf-indicator-value" style="color:var(--good)">${fmtBRL(provMedioMensal)}</div>
          </div>
        </div>
      </div>
    `;

    wireTabs();
  }

  function renderErrorScreen(message){
    const app = document.getElementById('tf-app');
    app.innerHTML = `
      <div class="tf-head">
        <div><div class="tf-title">Termômetro Financeiro</div></div>
        ${sessionBarHtml()}
      </div>
      ${tabBarHtml()}
      <div class="tf-error">⚠ ${message}<br><br><button class="tf-reset" id="tf-error-retry">Tentar novamente</button></div>
    `;
    wireTabs();
    document.getElementById('tf-error-retry').onclick = () => location.reload();
  }

  function render(){
    document.title = `Termômetro Financeiro - ${TAB_LABELS[activeTab]}`;
    if (activeTab === 'diario' && state.error) return renderErrorScreen(state.error);
    if (activeTab === 'investimentos' && invState.error) return renderErrorScreen(invState.error);
    if (activeTab === 'dashboard' && (state.error || invState.error)) return renderErrorScreen(state.error || invState.error);
    if (activeTab === 'investimentos') renderInvestimentos();
    else if (activeTab === 'dashboard') renderDashboard();
    else renderDiario();
  }

  loadTheme();
})();</script>
